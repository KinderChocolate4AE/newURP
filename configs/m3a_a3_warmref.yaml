# A-3 WARM REFERENCE (1-seed diagnostic; differs from m3a_a3_pilot.yaml
# ONLY in warm_start + wandb group -- R-2) -- L-reverse backward curriculum (docs/13 v0.1, R-1..R-5 ratified;
# docs/09 (dd)). SCRATCH arm (default): A-2 bistability showed warm habits are
# sticky; warm runs only as a 1-seed diagnostic reference (m3a_a3_warmref.yaml,
# differs ONLY in warm_start).
#
# Single hypothesis: clean firing is learnable -- the spawn distribution
# blocks discovery. Cone width FROZEN throughout (no width ladder); ZERO
# reward scaffolds (judged J trains as-is); the ONLY scaffold is the spawn
# distribution: T0 = P4 probe capture-grade witnesses (re-verified at startup,
# R-1 gate) -> R1..R4 jitter/rewind expansion -> R5 nominal.
# Eval spawns stay FROZEN except the train-eval gating bundle (R-5 STRICT).
#
# Pilot mid-gate (docs/13 SS4): (i) R1 pass >=2 seeds AND (ii) R3 reached
# >=1 seed, OR (iii) frozen-heldout clean nonzero >=1 seed.
# R1 FAILURE = representation-hypothesis rejection signal -> L-2stage reorder.
#
# Launch (server, 3 seeds, single GPU):
#   TRAIN_MODULE=shepherd.scripts.train_m3a CONFIG=configs/m3a_a3_pilot.yaml \
#     OUT=results/m3a_a3_pilot REQUIRED_COMMIT=<A-3 commit> GPU=0 SEEDS="0 1 2" \
#     bash scripts/run_ippo_seeds_parallel.sh

env_config: configs/m2_l2_train.yaml   # FROZEN scenario (never edited)

m3:                             # judgment/frozen reward params -- UNCHANGED
  o_star: 1.0e-3
  sigma_g: 1.0
  w_h: 1.0
  w_g: 0.3
  w_gf: 1.0
  lambda_cap: 5.0
  v_eff_mode: hard
  o_hi_release: 1.0e-2

curriculum:
  mode: reverse                 # A-3 L-reverse (docs/13 SS2)
  reverse:
    probe_glob: results/p4_probe/probe_s*.json
    verify_t0: true             # R-1 gate at startup (drop rule; raise if none)
    stages:
      - {name: r1, sigma_pos: 0.5, sigma_vel: 0.05, rewind_dx: 0.0, exit_clean: 0.5}
      - {name: r2, sigma_pos: 1.0, sigma_vel: 0.05, rewind_dx: 0.0, exit_clean: 0.3}
      - {name: r3, sigma_pos: 2.0, sigma_vel: 0.05, rewind_dx: 5.0, exit_clean: 0.2}
      - {name: r4, sigma_pos: 4.0, sigma_vel: 0.05, rewind_dx: 15.0, exit_clean: 0.1}
      - {name: r5, nominal: true}
    advance_sustain: 2
    stall_evals: 3
    max_steps: 300000           # R-ladder budget; cap freeze = stall evidence
  s2_exit: {heldout_clean_nonzero_last: 3}

warm_start:
  enabled: true                 # WARM 1-seed REFERENCE run (diagnostic-only,
  ckpt_dir: results/coma_run2/seed1   # NOT used for arm selection -- R-2)
  tag: best

loop:
  total_env_steps: 400000
  rollout_env_steps: 1024
  eval_interval_updates: 20
  eval_episodes: 20
  save_interval_updates: 20
  lr_anneal: linear
  lr_anneal_floor: 0.1

mappo:                          # P1 main recipe (unchanged)
  gamma: 0.99
  lam: 0.95
  lr: 3.0e-4
  epochs: 10
  minibatch_size: 256
  clip_eps: 0.2
  ent_coef_limiter: 0.0
  ent_coef_finisher: 0.003
  vf_coef: 0.5
  max_grad_norm: 0.5
  target_kl: 0.02
  hidden_sizes: [128, 128]
  init_log_std: 0.0
  ortho_init: true
  value_norm: true
  coma_mix: 0.5
  coma_gamma: 0.99
  coma_lam: 0.95

randomize:                      # attacker family (train only; eval nominal)
  enabled: true
  att_speed: [16.0, 24.0]
  adversary_start_x: [20.0, 28.0]
  adversary_omega: [8.0, 12.0]
  adv_a_max: [21.0, 30.0]

wandb:
  enabled: true
  project: newurp-l2
  group: m3a-a3-warmref
