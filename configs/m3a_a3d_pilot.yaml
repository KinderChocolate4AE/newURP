# A-3d PILOT -- SBE k-ladder, teacher-gated fire, robust delta-Phi limiter
# learning (docs/17 V-1..V-6 ratified; docs/09 (oo)). SCRATCH 3-seed
# mechanistic test (U-7); warm reference optional on server (SEEDS/ckpt).
#
# Scaffolds (ALL train-only; judgment m3: block and Gate defs unchanged):
#   spawn   = SBE bank (limiter velocities included; recoverable BY
#             CONSTRUCTION) + D0 robust witnesses; sigma_pos 0.02
#   teacher = fire iff RAW-obs clean (fire head FROZEN via weight restore)
#   reward  = shared J + alpha * [gamma*Phi(s') - Phi(s)]  (PBRS, fixed
#             Z_train seeds 61-65, n_phi 600 = scaffold-fidelity choice,
#             terminal Phi := 0)
# Primary metric (V-5): arrival_capture (reset non-clean -> clean -> captured)
# LCB95 > 0 on the gating bundle. Ladder exits gate on captured_rate (T-2a)
# with Wilson LCB/UCB hysteresis on an 80-episode fixed-CRN bundle (U-5).
#
# Launch (server):
#   TRAIN_MODULE=shepherd.scripts.train_m3a CONFIG=configs/m3a_a3d_pilot.yaml \
#     OUT=results/m3a_a3d_pilot REQUIRED_COMMIT=<A-3d commit> GPU=0 SEEDS="0 1 2" \
#     bash scripts/run_ippo_seeds_parallel.sh

env_config: configs/m2_l2_train.yaml   # FROZEN scenario (never edited)

m3:                             # judgment/frozen reward params -- UNCHANGED
  o_star: 1.0e-3
  sigma_g: 1.0
  w_h: 1.0
  w_g: 0.3
  w_gf: 1.0
  lambda_cap: 5.0
  v_eff_mode: hard
  o_hi_release: 1.0e-2

a3d:                            # docs/17 SS3 (V-3/V-4); absent block = no-op
  teacher_gate: true
  freeze_finisher: true
  phi: {alpha: 0.5, beta: 1.0, tau: 0.05, n: 600,
        seeds: [61, 62, 63, 64, 65]}   # Z_train; audit 71-75 reserved

curriculum:
  mode: sbe                     # A-3d k-ladder (docs/17 SS2)
  sbe:
    bank: results/a3d_sbe_bank.json
    robust_bank: results/a3_robust_bank.json
    sigma_pos: 0.02
    stages:
      - {name: d0, k: 0, exit: 0.45}   # A-3b R0 regression anchor
      - {name: d1, k: 1, exit: 0.40}
      - {name: d2, k: 2, exit: 0.30}
      - {name: d3, k: 4, exit: 0.20}
      - {name: d4, k: 8, exit: 0.10}
      - {name: d5, nominal: true}
    gate: {episodes: 80, z: 1.645, backoff_margin: 0.05}   # U-5 Wilson
    max_steps: 360000
  s2_exit: {heldout_clean_nonzero_last: 3}

warm_start:
  enabled: false                # SCRATCH (V-6)

loop:
  total_env_steps: 520000
  rollout_env_steps: 1024
  eval_interval_updates: 20
  eval_episodes: 20             # frozen bundle; gating bundle = gate.episodes
  save_interval_updates: 20
  lr_anneal: linear
  lr_anneal_floor: 0.1

mappo:                          # P1 main recipe (unchanged)
  gamma: 0.99
  lam: 0.95
  lr: 3.0e-4
  epochs: 10
  minibatch_size: 256
  clip_eps: 0.2
  ent_coef_limiter: 0.0
  ent_coef_finisher: 0.003
  vf_coef: 0.5
  max_grad_norm: 0.5
  target_kl: 0.02
  hidden_sizes: [128, 128]
  init_log_std: 0.0
  ortho_init: true
  value_norm: true
  coma_mix: 0.5
  coma_gamma: 0.99
  coma_lam: 0.95

randomize:                      # family (train; att_speed pinned by spawns)
  enabled: true
  att_speed: [16.0, 24.0]
  adversary_start_x: [20.0, 28.0]
  adversary_omega: [8.0, 12.0]
  adv_a_max: [21.0, 30.0]

wandb:
  enabled: true
  project: newurp-l2
  group: m3a-a3d-pilot
